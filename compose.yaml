# Exactly one replica: a second poller gets 409 Conflict from Telegram (§10).
services:
  tykee:
    build: .
    image: tykee:latest
    container_name: tykee
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8080"                          # dashboard (M4), LAN only; host 8081 (8080 taken on the NAS)
    volumes:
      - ${TYKEE_DATA_DIR:-./data}:/data      # on the NAS: /volume_nvme/tykee/data
    mem_limit: 1g
    healthcheck:                             # §14.1: /healthz, or the heartbeat file without a dashboard
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m                       # model warm-up + vault reconcile
    logging:                                 # unattended for weeks: cap stdout logs at ~50 MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
