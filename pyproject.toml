[project]
name = "tykee"
version = "0.1.0"
description = "Private Telegram decision bot for two, powered by the Claude API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.13,<4",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "tzdata",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits real external APIs; opt-in via `-m integration`"]
addopts = "-m 'not integration'"
