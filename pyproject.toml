[project]
name = "tykee"
version = "0.1.0"
description = "Private Telegram decision bot for two, powered by the Claude API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.13,<4",
  "anthropic>=1.11,<2",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1",
  "fastembed>=0.8,<0.9",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "numpy>=2",
  "python-frontmatter>=1.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlite-vec>=0.1.6",
  "tzdata",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",  # Starlette TestClient
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/eval_data.py" = ["E501", "RUF001"]  # fixture text: one note per line, real Chinese punctuation

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "frontmatter", "fastembed", "fastembed.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: hits real external APIs; opt-in via `-m integration`"]
addopts = "-m 'not integration'"
