# CI (§14.5): the same checks as `make check`, in the same image, plus shellcheck and an
# amd64 image build. Runs offline-safe unit tests only; `-m integration` stays opt-in.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    env:
      UV_LINK_MODE: copy
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  shellcheck:
    name: shellcheck deploy.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy.sh

  no-data-in-git:
    name: no bot data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if memory, databases, models or secrets are tracked
        run: |
          bad="$(git ls-files | grep -E '(^|/)(data|vault)/|\.db(-wal|-shm)?$|\.onnx$|(^|/)models--|(^|/)\.env$' || true)"
          if [ -n "$bad" ]; then
            echo "These files must never be committed (§12):"
            echo "$bad"
            exit 1
          fi

  image:
    name: docker build (linux/amd64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
