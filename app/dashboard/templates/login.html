{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login card">
  <h1>🎲 Tykee</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  {% if locked %}<div class="flash error">Too many attempts. Try again in a few minutes.</div>{% endif %}
  <form method="post" action="/login">
    {{ csrf_input }}
    <label for="password">Admin password</label>
    <input id="password" type="password" name="password" autofocus autocomplete="current-password">
    <div class="actions"><button class="primary">Log in</button></div>
  </form>
</div>
{% endblock %}
